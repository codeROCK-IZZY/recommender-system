[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "1.0.0"
description = "Recommendations measured honestly: strong baselines, a temporal split, cold start and serving."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.12", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "scipy-stubs>=1.14", "httpx>=0.27"]

[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "NPY"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "PLR0917", "PLR0914", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]
"src/recsys/{evaluate,report}.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
